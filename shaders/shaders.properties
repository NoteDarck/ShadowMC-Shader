screen = <profile> [SHADOWS] [LIGHTING] [MATERIALS] [NATURE] [HAND_LIGHT] [ENCHANTMENT] [ATMOSPHERE] *
screen.columns = 2
screen.SHADOWS = shadowMapResolution shadowDistance SHADOW_BIAS SHADOW_DISTORT_FACTOR SHADOW_BRIGHTNESS SHADOW_FILTER SHADOW_DISTORT_ENABLED NORMAL_BIAS EXCLUDE_FOLIAGE EXCLUDE_LIGHT_SOURCES OPAQUE_LEAVES
