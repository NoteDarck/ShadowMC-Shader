oldHandLight=false
# ShadowMC - sombras responsivas e iluminação vanilla na mão
screen = <profile> [QUALITY] [ATMOSPHERE] *
screen.columns = 3
screen.QUALITY = SHADOW_MAP_RESOLUTION SHADOW_FILTER SHADOW_DISTORT_FACTOR SHADOW_BIAS VEGETATION_SWAY
screen.ATMOSPHERE = ATMOSPHERIC_FOG

sliders = SHADOW_MAP_RESOLUTION SHADOW_DISTORT_FACTOR SHADOW_BIAS SHADOW_BRIGHTNESS SHADOW_FILTER VEGETATION_SWAY ATMOSPHERIC_FOG

# Filtros baixos evitam que o shadow pass fique vários frames atrás da câmera.
profile.Potato = SHADOW_MAP_RESOLUTION:256 SHADOW_DISTORT_FACTOR:0.20 SHADOW_BIAS:1.80 SHADOW_BRIGHTNESS:0.58 SHADOW_FILTER:0 VEGETATION_SWAY:0.005 ATMOSPHERIC_FOG:0.40
profile.Low = SHADOW_MAP_RESOLUTION:512 SHADOW_DISTORT_FACTOR:0.14 SHADOW_BIAS:1.50 SHADOW_BRIGHTNESS:0.60 SHADOW_FILTER:0 VEGETATION_SWAY:0.010 ATMOSPHERIC_FOG:0.55
profile.Balanced = SHADOW_MAP_RESOLUTION:1024 SHADOW_DISTORT_FACTOR:0.10 SHADOW_BIAS:1.35 SHADOW_BRIGHTNESS:0.62 SHADOW_FILTER:0 VEGETATION_SWAY:0.015 ATMOSPHERIC_FOG:0.65
profile.High = SHADOW_MAP_RESOLUTION:1024 SHADOW_DISTORT_FACTOR:0.07 SHADOW_BIAS:1.10 SHADOW_BRIGHTNESS:0.58 SHADOW_FILTER:1 VEGETATION_SWAY:0.020 ATMOSPHERIC_FOG:0.80
